# One-time npmjs.com setup: Package Settings -> Trusted Publisher -> GitHub Actions,
# with owner `ai-meharbnsingh`, repo `session-rx`, and workflow file `publish.yml`.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "${version}" != "${tag_version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
              exit 1
            fi
            echo "Publishing session-rx version ${version} from tag ${GITHUB_REF_NAME}."
          else
            echo "Publishing session-rx version ${version} (workflow_dispatch)."
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
